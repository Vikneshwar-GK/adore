version: 2

models:
  - name: int_hourly_weather_transit
    description: "Hourly weather conditions joined with city-wide transit performance. Grain: one row per hour. Left join — hours with no transit data have NULL transit columns. View in warehouse schema."
    columns:
      - name: date_hour
        description: "Timestamp truncated to hour — primary key"
        tests:
          - not_null
          - unique

  - name: int_daily_weather_incidents
    description: "Daily weather summary joined with daily 311 incident counts. Grain: one row per date. Left join — days with no incidents have NULL incident columns. View in warehouse schema."
    columns:
      - name: date
        description: "Calendar date — primary key"
        tests:
          - not_null
          - unique
